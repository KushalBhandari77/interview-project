spring:
  application:
    name: reconciliation
  datasource:
    url: jdbc:h2:file:./data/reconciliation;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: false

server:
  port: 8080

recon:
  tolerance: 0.01
  window:
    min: 1
    max: 3
